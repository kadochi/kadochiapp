services:
  traefik:
    image: traefik:v3.7.1
    container_name: kadochi-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Cloudflare Origin Certificate (generate at dash.cloudflare.com → SSL/TLS → Origin Server)
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # Dashboard (optional)
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./certs:/certs:ro"
      - "./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro"
    networks:
      - web

  # Next.js frontend
  nextjs:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: kadochi-nextjs
    restart: unless-stopped

    # Load all secrets from the production env file.
    # The environment block below overrides URL values to use Docker-internal
    # hostnames — the public URLs in .env.production would route through
    # Traefik/external DNS and never reach the wordpress container directly.
    env_file:
      - ./front/.env.production

    environment:
      NODE_ENV: production
      # Internal Docker service name so server-side fetches stay on the
      # private network and bypass Traefik entirely.
      WP_BASE_URL: http://wordpress
      WOO_BASE_URL: http://wordpress
      # Public site URL and cookie domain for production.
      NEXT_PUBLIC_SITE_URL: https://kadochi.com
      COOKIE_DOMAIN: .kadochi.com

    labels:
      - "traefik.enable=true"

      # Main domain
      - "traefik.http.routers.nextjs.rule=Host(`kadochi.com`) || Host(`www.kadochi.com`)"
      - "traefik.http.routers.nextjs.entrypoints=websecure"
      - "traefik.http.routers.nextjs.tls=true"

      # Internal app port
      - "traefik.http.services.nextjs.loadbalancer.server.port=3000"

    networks:
      - web

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: kadochi-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: kadochi
      MYSQL_USER: kadochi
      MYSQL_PASSWORD: zyzba1-vyqxem-muareZ
      MYSQL_ROOT_PASSWORD: zyzba1-vyqxem-muareZ

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - web

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: kadochi-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - web

  # WordPress
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    image: kadochi-wordpress:php8.2-apache
    container_name: kadochi-wordpress
    restart: unless-stopped

    depends_on:
      - mysql
      - redis

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: kadochi
      WORDPRESS_DB_USER: kadochi
      WORDPRESS_DB_PASSWORD: zyzba1-vyqxem-muareZ

      # Redis
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_HOME', 'https://api.kadochi.com');
        define('WP_SITEURL', 'https://api.kadochi.com');

    volumes:
      # Custom theme (see wordpress/theme/)
      - ./wordpress/theme:/var/www/html/wp-content/themes/kadochi

      # Persistent uploads/plugins
      - wordpress_data:/var/www/html

    labels:
      - "traefik.enable=true"

      # API / WP domain
      - "traefik.http.routers.wordpress.rule=Host(`api.kadochi.com`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls=true"

      # Internal apache port
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"

    networks:
      - web

volumes:
  mysql_data:
  wordpress_data:
  redis_data:

networks:
  web:
    driver: bridge
