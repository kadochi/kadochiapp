services:
  # Next.js frontend
  nextjs:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: kadochi-nextjs
    restart: unless-stopped

    depends_on:
      - redis

    # Load all secrets from the production env file.
    # The environment block below overrides URL values to use Docker-internal
    # hostnames — the public URLs in .env.production would route through
    # Traefik/external DNS and never reach the wordpress container directly.
    env_file:
      - ./front/.env.production

    environment:
      NODE_ENV: production
      # Bind on all interfaces so INTERNAL_SITE_ORIGIN loopback proxy works.
      HOSTNAME: "0.0.0.0"
      # Internal Docker service names — avoid public DNS/TLS hairpin from nextjs.
      # Use the unique container_name (not the service name "wordpress"), since
      # Hamtimi's stack also has a service named "wordpress" on the shared
      # "web" network — the service name resolves to both containers.
      WP_BASE_URL: http://kadochi-wordpress
      WOO_BASE_URL: http://kadochi-wordpress
      NEXT_PUBLIC_WP_BASE_URL: https://api.kadochi.com
      # Public site URL and cookie domain for production.
      NEXT_PUBLIC_SITE_URL: https://kadochi.com
      # Server-side /api/wp fallback stays in-container (not https://kadochi.com).
      INTERNAL_SITE_ORIGIN: http://127.0.0.1:3000
      # Sign-in is apex-only (kadochi.com). Leave the cookie host-only rather
      # than scoping it to .kadochi.com — the leading-dot value is silently
      # dropped on the apex host anyway (see resolveCookieDomain).
      COOKIE_DOMAIN: ""
      # Force the Secure flag deterministically instead of inferring it from
      # x-forwarded-proto (the removed in-compose Traefik used to guarantee it).
      # REQUIRES the edge to redirect HTTP->HTTPS so every browser is on HTTPS;
      # otherwise HTTP visitors get a Secure cookie their browser discards.
      COOKIE_SECURE: "true"
      REDIS_URL: redis://redis:6379
      # Live payments unless front/.env.production explicitly sets sandbox.
      ZARINPAL_MODE: production

    labels:
      - "traefik.enable=true"

      # Main domain
      - "traefik.http.routers.nextjs.rule=Host(`kadochi.com`) || Host(`www.kadochi.com`)"
      - "traefik.http.routers.nextjs.entrypoints=websecure"
      - "traefik.http.routers.nextjs.tls=true"

      # Internal app port
      - "traefik.http.services.nextjs.loadbalancer.server.port=3000"

    networks:
      - web

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: kadochi-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: kadochi
      MYSQL_USER: kadochi
      MYSQL_PASSWORD: zyzba1-vyqxem-muareZ
      MYSQL_ROOT_PASSWORD: zyzba1-vyqxem-muareZ

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - web

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: kadochi-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - web

  # WordPress
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    image: kadochi-wordpress:php8.2-apache
    container_name: kadochi-wordpress
    restart: unless-stopped

    depends_on:
      - mysql
      - redis

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: kadochi
      WORDPRESS_DB_USER: kadochi
      WORDPRESS_DB_PASSWORD: zyzba1-vyqxem-muareZ

      # Redis
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_HOME', 'https://api.kadochi.com');
        define('WP_SITEURL', 'https://api.kadochi.com');
        // Internal Docker HTTP: Woo query-key auth must be treated as HTTPS.
        // Use $$ so Compose does not eat $$_GET / $$_SERVER (see docker-compose.local.yml).
        if (!empty($$_GET['consumer_key']) && !empty($$_GET['consumer_secret'])) {
          $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      # Custom theme (see wordpress/theme/)
      - ./wordpress/theme:/var/www/html/wp-content/themes/kadochi

      # Persistent uploads/plugins
      - wordpress_data:/var/www/html

    labels:
      - "traefik.enable=true"

      # API / WP domain
      - "traefik.http.routers.wordpress.rule=Host(`api.kadochi.com`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls=true"

      # Internal apache port
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"

    networks:
      - web

volumes:
  mysql_data:
  wordpress_data:
  redis_data:

networks:
  web:
    external: true
