services:
  # Next.js frontend — http://localhost:3000
  nextjs:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: kadochi-nextjs
    restart: unless-stopped

    depends_on:
      - redis

    # Load all front secrets from front/.env.local.
    # The environment block below always overrides WP_BASE_URL and NEXT_PUBLIC_SITE_URL
    # to use Docker-internal hostnames — "localhost" would resolve to the container
    # itself and never reach the wordpress service.
    env_file:
      - ./front/.env.local

    environment:
      NODE_ENV: development
      WP_BASE_URL: http://wordpress
      WOO_BASE_URL: http://wordpress
      NEXT_PUBLIC_WP_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    networks:
      - web

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: kadochi-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: strongpassword
      MYSQL_ROOT_PASSWORD: rootpassword

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - web

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: kadochi-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - web

  # WordPress — http://localhost:8080
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    image: kadochi-wordpress:php8.2-apache
    container_name: kadochi-wordpress
    restart: unless-stopped

    depends_on:
      - mysql
      - redis

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: strongpassword

      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');

    ports:
      - "8080:80"

    volumes:
      - ./wordpress/theme:/var/www/html/wp-content/themes/kadochi
      - wordpress_data:/var/www/html

    networks:
      - web

volumes:
  mysql_data:
  wordpress_data:
  redis_data:

networks:
  web:
    driver: bridge
