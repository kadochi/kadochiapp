services:
  # Next.js frontend — http://localhost:3000
  nextjs:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: kadochi-nextjs
    restart: unless-stopped

    depends_on:
      - redis
      - wordpress

    # Load all front secrets from front/.env.local.
    # The environment block below always overrides WP_BASE_URL and NEXT_PUBLIC_SITE_URL
    # to use Docker-internal hostnames — "localhost" would resolve to the container
    # itself and never reach the wordpress service.
    env_file:
      - ./front/.env.local

    environment:
      NODE_ENV: development
      # Docker sets HOSTNAME to the container id; Next binds to that IP only.
      # Use 0.0.0.0 so loopback proxy fallback (localhost:3000) works inside the container.
      HOSTNAME: "0.0.0.0"
      OTP_DEV_BYPASS: "1"
      OTP_DEV_PHONE: "09120000000"
      NEXT_PUBLIC_OTP_DEV_PHONE: "09120000000"
      WP_BASE_URL: http://wordpress
      WOO_BASE_URL: http://wordpress
      NEXT_PUBLIC_WP_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      # Disable Secure flag so cookies land on plain-HTTP localhost.
      # The production compose sets COOKIE_DOMAIN=.kadochi.com; force it
      # empty here so a copied .env.local never leaks prod domain into local.
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""

    ports:
      - "3000:3000"

    networks:
      - web

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: kadochi-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: strongpassword
      MYSQL_ROOT_PASSWORD: rootpassword

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - web

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: kadochi-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - web

  # WordPress — http://localhost:8080
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    image: kadochi-wordpress:php8.2-apache
    container_name: kadochi-wordpress
    restart: unless-stopped

    depends_on:
      - mysql
      - redis

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: strongpassword

      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        // Local only: WooCommerce v3 accepts query-string keys over HTTPS only.
        // Internal Docker fetches use http://wordpress — treat key auth as secure.
        if (isset($$_GET['consumer_key']) && isset($$_GET['consumer_secret'])) {
          $$_SERVER['HTTPS'] = 'on';
        }

    ports:
      - "8080:80"

    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost/wp-json/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    volumes:
      - ./wordpress/theme:/var/www/html/wp-content/themes/kadochi
      - wordpress_data:/var/www/html

    networks:
      - web

volumes:
  mysql_data:
  wordpress_data:
  redis_data:

networks:
  web:
    driver: bridge
