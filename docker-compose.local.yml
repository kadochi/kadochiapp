services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      WORDPRESS_INTERNAL_URL: ${LOCAL_WORDPRESS_INTERNAL_URL:-http://wordpress}
      NEXT_PUBLIC_WORDPRESS_URL: ${LOCAL_NEXT_PUBLIC_WORDPRESS_URL:-http://localhost:8080}
      KADOCHI_PAYMENT_METHOD_ID: ${LOCAL_KADOCHI_PAYMENT_METHOD_ID:-WC_ZPal}
      KADOCHI_FRONTEND_URL: ${LOCAL_KADOCHI_FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      # Keep Next's frequently-written compiler cache off the macOS bind mount.
      - front_next:/app/.next
    depends_on:
      wordpress:
        condition: service_started

  wordpress:
    build:
      context: ./wordpress
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: ${LOCAL_WORDPRESS_DB_HOST:-mysql:3306}
      WORDPRESS_DB_NAME: ${LOCAL_WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${LOCAL_WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${LOCAL_WORDPRESS_DB_PASSWORD:-wordpress_dev_password}
      WP_ENVIRONMENT_TYPE: ${LOCAL_WP_ENVIRONMENT_TYPE:-development}
      MELIPAYAMAK_OTP_URL: ${LOCAL_MELIPAYAMAK_OTP_URL:-}
      KADOCHI_PAYMENT_METHOD_ID: ${LOCAL_KADOCHI_PAYMENT_METHOD_ID:-WC_ZPal}
      KADOCHI_FRONTEND_URL: ${LOCAL_KADOCHI_FRONTEND_URL:-http://localhost:3000}
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/kadochi:ro
      - ./plugins/kadochi-core:/var/www/html/wp-content/plugins/kadochi-core:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${LOCAL_MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:-wordpress_dev_password}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  front_node_modules:
  front_next:
  wordpress_data:
  mysql_data:
