; Apply environment-backed runtime constants even when wp-config.php lives on
; an existing persistent volume and is not regenerated by the Docker image.
auto_prepend_file = /usr/local/lib/php/kadochi-runtime-config.php
; WooCommerce and active integrations can exceed PHP's 128 MB default while
; building a cart response. Keep CLI and Apache on the same supported limit.
memory_limit = 256M
